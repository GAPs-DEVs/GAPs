server {
    listen 80 default_server;
    server_name _;

    # Keep HTTP validation reachable for automatic certificate renewals.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    location / {
        return 308 https://$host$request_uri;
    }
}

server {
    listen 443 ssl default_server;
    server_name _;

    # --cert-name backend provides stable paths independently of the public IP.
    ssl_certificate /etc/letsencrypt/live/backend/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/backend/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    location / {
        # A variable upstream lets Docker DNS pick up API container IP changes.
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $api_backend api:8000;
        proxy_pass http://$api_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
    }
}
