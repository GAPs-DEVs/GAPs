name: guitar-practice-https

services:
  nginx:
    image: nginx:1.28-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # Start with HTTP before issuance; switch .env to https.conf afterwards.
      - ./${NGINX_CONFIG:-http.conf}:/etc/nginx/conf.d/default.conf:ro
      - certificates:/etc/letsencrypt:ro
      - challenges:/var/www/certbot:ro
    networks: [backend]
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  certbot:
    # Webroot validation of IP certificates requires Certbot >= 5.4.
    image: certbot/certbot:v5.4.0
    profiles: [tools]
    volumes:
      # Preserve account keys, renewal settings and certificates between runs.
      - certificates:/etc/letsencrypt
      - challenges:/var/www/certbot

networks:
  backend:
    # Existing API Compose attaches api:8000 to this DB network.
    external: true
    name: guitar-practice-db_default

volumes:
  certificates:
  challenges:
