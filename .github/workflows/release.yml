name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            name: macos-arm64
          - os: windows-latest
            name: windows-x64
    defaults:
      run:
        shell: bash
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
          enable-cache: true

      - name: Resolve version
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            echo "APP_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          else
            echo "APP_VERSION=0.0.0-dev.${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"
          fi

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run tests
        run: uv run pytest -q

      - name: Write .env
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          if [[ -z "$GOOGLE_CLIENT_ID" || -z "$GOOGLE_CLIENT_SECRET" ]]; then
            echo "::error::GOOGLE_CLIENT_ID / GOOGLE_CLIENT_SECRET secrets are not set"
            exit 1
          fi
          printf 'GOOGLE_CLIENT_ID=%s\nGOOGLE_CLIENT_SECRET=%s\n' "$GOOGLE_CLIENT_ID" "$GOOGLE_CLIENT_SECRET" > .env

      - name: Build
        run: uv run pyinstaller GuitarPracticeApp.spec --noconfirm --clean

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: |
          codesign --verify --deep --strict dist/GAPs.app
          ditto -c -k --keepParent dist/GAPs.app "GAPs-${APP_VERSION}-${{ matrix.name }}.zip"

      - name: Package (Windows)
        if: runner.os == 'Windows'
        run: 7z a -tzip "GAPs-${APP_VERSION}-${{ matrix.name }}.zip" ./dist/GAPs

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: GAPs-*.zip
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish release
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: release/*.zip
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
