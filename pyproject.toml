[project]
name = "guitar-practice-support"
version = "1.0.0"
description = "Desktop guitar fretboard detector built with PySide6, YOLO, and MediaPipe."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "google-auth-oauthlib",
    "google-genai>=2.8.0",
    "librosa>=0.11",
    "mediapipe>=0.10",
    "numpy>=2.0",
    "opencv-python>=4.10",
    "pyguitarpro>=0.11",
    "PySide6>=6.7",
    "requests>=2.31",
    "sounddevice>=0.5",
    "ultralytics>=8.3",
]

[dependency-groups]
dev = [
    "pyinstaller>=6.10",
    "pytest>=8.4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.uv]
package = false
