name: guitar-practice-db

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file:
      - .env.local
    environment:
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      # Host-only access for local administration. The API container should use postgres:5432.
      - "127.0.0.1:5432:5432"
    volumes:
      - guitar_practice_postgres_data:/var/lib/postgresql/data
      - ./init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  migrate:
    image: postgres:16-alpine
    profiles: ["tools"]
    env_file:
      - .env.local
    environment:
      PGHOST: postgres
      PGPORT: "5432"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./migrations:/migrations:ro
      - ./seed:/seed:ro
      - ./scripts:/scripts:ro
      - ./grant_api_role.sql.example:/admin/grant_api_role.sql.example:ro
    entrypoint: ["/bin/sh", "/scripts/database.sh"]
    command: ["migrate"]
    restart: "no"

volumes:
  guitar_practice_postgres_data:
